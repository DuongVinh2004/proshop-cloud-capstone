limit_req_zone $binary_remote_addr zone=global_req_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_req_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_req_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=order_req_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;

upstream proshop_frontend {
    server frontend:80;
}

upstream proshop_backend {
    server backend:5000;
}

upstream proshop_grafana {
    server grafana:3000;
}

log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ua="$upstream_addr" us="$upstream_status"';

# Thêm cấu trúc JSON an toàn cho Loki, bảo vệ dữ liệu nhạy cảm
log_format security_json escape=json
  '{'
    '"timestamp":"$msec",'
    '"request_id":"$request_id",'
    '"client_ip":"$remote_addr",'
    '"forwarded_for_raw":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":"$status",'
    '"bytes_sent":"$bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"connection":"$connection",'
    '"connection_requests":"$connection_requests"'
  '}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log main_ext;
    # Ghi thêm vào file log JSON mới, giữ nguyên file cũ
    access_log /var/log/nginx/security_access_json.log security_json;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 10m;

    # ── TIMEOUTS CHỐNG SLOWLORIS ──────────────────────────────────────────────
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        # Không limit rate hay conn ở đây để Certbot renew an toàn
    }

    # ── HONEYPOT (BẪY HACKER) ────────────────────────────────────────────────
    # Ghi log và trả 444 để đóng kết nối (Quan sát, không auto-ban OS-level)
    location ~* ^/(wp-admin|wp-login\.php|\.env|\.git|phpmyadmin|config\.php|db_backup) {
        return 444;
    }

    # ── METRICS NGINX (STUB_STATUS) ───────────────────────────────────────────
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
    }

    # ── HEALTH CHECK ──────────────────────────────────────────────────────────
    location = /api/health {
        proxy_pass http://proshop_backend;
        # Không limit để Prometheus/Monitor truy cập dễ dàng
    }

    # ── CRITICAL APIs (LOGIN & REGISTER) ─────────────────────────────────────
    location ~* ^/api/users(/login)?$ {
        limit_req zone=login_req_limit burst=5 nodelay;
        limit_conn conn_limit_per_ip 5;
        proxy_pass http://proshop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── ORDER APIs (CHỐNG SPAM ĐẶT HÀNG) ─────────────────────────────────────
    location /api/orders/ {
        limit_req zone=order_req_limit burst=10 nodelay;
        limit_conn conn_limit_per_ip 10;
        proxy_pass http://proshop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── GENERAL READ-ONLY / WRITE APIs ───────────────────────────────────────
    location /api/ {
        limit_req zone=api_req_limit burst=20 nodelay;
        limit_conn conn_limit_per_ip 20;
        proxy_pass http://proshop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://proshop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana is kept behind the same public Nginx endpoint.
    # Use a strong admin password in .env.
    location /grafana/ {
        limit_req zone=global_req_limit burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;
        proxy_pass http://proshop_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        limit_req zone=global_req_limit burst=50 nodelay;
        limit_conn conn_limit_per_ip 50;
        proxy_pass http://proshop_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
