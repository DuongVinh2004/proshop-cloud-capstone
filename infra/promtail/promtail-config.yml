server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx-json
    pipeline_stages:
      - json:
          expressions:
            method: method
            status: status
            client_ip: client_ip
            uri: uri
      - labels:
          method:
          status:
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx-security
          host: ec2-proshop
          __path__: /var/log/nginx/security_access_json.log

  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx-access
          host: ec2-proshop
          __path__: /var/log/nginx/access.log

  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx-error
          host: ec2-proshop
          __path__: /var/log/nginx/error.log

  - job_name: docker-containers
    pipeline_stages:
      - docker: {}
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          host: ec2-proshop
          __path__: /var/lib/docker/containers/*/*-json.log
